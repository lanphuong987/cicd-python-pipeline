version: "3.9"

services:
  calibre-web:
    image: lanphuong2000/calibre-web:${IMAGE_TAG:-latest}
    
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8083')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8083:8083"
    volumes:
      - ./config:/root/.config/calibre-web
      - ./books:/books
    restart: always