name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: calibre-web
  CONTAINER_NAME: calibre-web-source-calibre-web-1
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}


jobs:
  # ─── Job 1: Linting & Security Scan ───
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        continue-on-error: true
        run: flake8 . --config=.flake8

      - name: Run test
        continue-on-error: true
        run: pytest --tb=short

  # ─── Job 2: Build & Deploy (chỉ chạy khi push lên main) ───
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: Production
    permissions:
     contents: read
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
         image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
         format: 'table'
         severity: 'HIGH,CRITICAL'
         exit-code: '0'

      - name: Deploy to server via ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          envs: IMAGE_NAME,GITHUB_SHA,DOCKER_USERNAME
          script: |
           cd /www/wwwroot/calibre_web/calibre-web-source

           PREVIOUS_TAG=$(cat .current_tag 2>/dev/null || echo "latest")
           NEW_TAG=${{ github.sha }}
           

      
           git pull origin main
           docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:$NEW_TAG

           echo "IMAGE_TAG=${{ github.sha }}" > .env
           echo "DOCKER_USERNAME=${{ env.DOCKER_USERNAME }}" >> .env
           echo "IMAGE_NAME=${{ env.IMAGE_NAME }}" >> .env

           docker compose up -d --no-build --force-recreate
          

           # Health check
           
           for i in $(seq 1 10); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' ${{env.CONTAINER_NAME}} 2>/dev/null)
            echo "Status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
             echo "✅ Container healthy"
             break
            fi
           echo "Waiting... ($i/10) status=$STATUS"
           sleep 5
           done

           #Auto rollback
           if [ "$STATUS" != "healthy" ]; then
            echo "❌ Deploy failed, rolling back to $PREVIOUS_TAG"
            IMAGE_TAG=$PREVIOUS_TAG docker compose up -d --no-build --force-recreate
           exit 1
           fi


           # save current tag for next rollback
           echo $NEW_TAG > .current_tag
           echo "✅ Deploy successful: $NEW_TAG"
           docker image prune -f 


      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Deploy FAILED
            Repo: ${{ github.repository }}
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
 
        